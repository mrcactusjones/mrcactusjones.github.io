name: Disc Tracker

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "disc-tracker/**"
      - ".github/workflows/disc-tracker.yml"

permissions:
  contents: write

concurrency:
  group: disc-tracker-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: disc-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: disc-tracker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  scrape:
    # Only scheduled/manual runs on the default branch collect data.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: disc-tracker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Scrape, parse, export
        env:
          # Optional: free keys from developer.ebay.com. Without them eBay is skipped.
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m disctracker run
      - name: Commit data
        working-directory: .
        run: |
          git config user.name "disc-tracker[bot]"
          git config user.email "disc-tracker@users.noreply.github.com"
          git add disc-tracker/data disc-tracker/site/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "disc-tracker: data update $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
