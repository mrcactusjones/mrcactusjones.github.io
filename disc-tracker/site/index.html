<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Daily retail price history for disc golf discs, scraped from public Shopify storefronts.">
<title>Disc Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23184f95'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fcfcfb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- Chart.js is loaded on demand by app.js (pinned cdnjs URL) so the disc list never waits on the CDN. -->
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="#/">Disc Tracker</a>
    <span class="tagline">Disc golf retail prices over time</span>
    <ul class="meta" id="site-meta" aria-label="Data summary"></ul>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="wrap" id="app">
    <p class="loading">Loading disc data&hellip;</p>
    <noscript><p class="error">Disc Tracker needs JavaScript to load its price data.</p></noscript>
  </div>
</main>

<footer class="site-foot">
  <div class="wrap" id="site-foot"></div>
</footer>
</body>
</html>
